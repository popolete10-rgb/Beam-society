<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Page 🍪</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container" class="card">
  
  <h1>Send your cookie 🍪</h1>

  <p class="notice">
    This form will send the message you write to our server.
  </p>

  <input id="message" placeholder="Type your cookie..." />

  <button onclick="send()">Send</button>

  <p id="status"></p>

</div>

<script src="script.js"></script>
</body>
</html>
